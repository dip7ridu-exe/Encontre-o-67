<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encontre o 67</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;
  --surface:#17171b;
  --surface-2:#1e1e23;
  --border:#2a2a30;
  --text:#f2f0ea;
  --text-muted:#8d8d96;
  --accent:#d4a857;
  --radius:16px;
  --font-display:'Fraunces',serif;
  --font-body:'Work Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}

header{
  position:sticky;top:0;z-index:10;
  background:rgba(11,11,13,.85);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:28px 20px 22px;text-align:center;
}
header h1{
  font-family:var(--font-display);font-weight:600;
  font-size:clamp(28px,4vw,38px);letter-spacing:-.02em;
  display:inline-flex;align-items:center;gap:10px;
}
header h1::before{
  content:'';width:8px;height:8px;border-radius:50%;
  background:var(--accent);display:inline-block;
}
header p{
  margin-top:6px;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-muted);
}

main{max-width:700px;margin:auto;padding:30px 20px 60px;text-align:center}

.play-area{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:30px 20px;position:relative;
}

#generateBtn{
  padding:14px 32px;border-radius:14px;border:none;
  background:var(--accent);color:#1a1305;
  font-family:var(--font-display);font-weight:700;font-size:18px;
  cursor:pointer;transition:filter .15s ease,transform .15s ease;
  margin-bottom:24px;
}
#generateBtn:hover{filter:brightness(1.08)}
#generateBtn:active{transform:scale(.97)}
#generateBtn:disabled{opacity:.5;cursor:not-allowed}

.image-frame{
  width:100%;max-width:340px;margin:0 auto;
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius);display:flex;align-items:center;
  justify-content:center;overflow:hidden;position:relative;
  min-height:300px;
}
.image-frame img{
  width:100%;max-height:380px;object-fit:contain;display:block;
}
.image-frame .placeholder{
  color:var(--text-muted);font-family:var(--font-mono);
  font-size:13px;padding:20px;
}

/* ===== COUNTDOWN ===== */
.countdown-container{
  display:flex;flex-direction:column;align-items:center;
  gap:20px;padding:20px;
}
.timer-ring{position:relative;width:140px;height:140px}
.timer-ring svg{transform:rotate(-90deg);width:140px;height:140px}
.timer-ring circle{fill:none;stroke-width:5}
.timer-ring .bg{stroke:var(--border)}
.timer-ring .progress{
  stroke:var(--accent);stroke-linecap:round;
  transition:stroke-dashoffset 1s linear;
}
.timer-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.timer-seconds{
  font-family:var(--font-display);font-weight:700;
  font-size:36px;color:var(--accent);
}
.timer-label{
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-muted);margin-top:2px;
}

.shuffle-icon{
  font-size:50px;
  animation:shuffleSlow 1.8s ease-in-out infinite;
}
@keyframes shuffleSlow{
  0%{transform:rotateY(0deg);opacity:1}
  25%{transform:rotateY(90deg);opacity:.4}
  50%{transform:rotateY(180deg);opacity:1}
  75%{transform:rotateY(270deg);opacity:.4}
  100%{transform:rotateY(360deg);opacity:1}
}

/* Curiosity */
.curiosity-box{
  width:100%;max-width:340px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px;
  text-align:left;
}
.curiosity-label{
  font-family:var(--font-mono);font-size:9px;
  color:var(--accent);text-transform:uppercase;
  letter-spacing:.12em;margin-bottom:8px;
}
.curiosity-text{
  font-family:var(--font-body);font-size:13px;
  color:var(--text);line-height:1.6;
}
.curiosity-link{
  display:inline-block;margin-top:10px;
  font-family:var(--font-mono);font-size:11px;
  color:var(--accent);text-decoration:none;
  border-bottom:1px dashed var(--accent);
  padding-bottom:1px;
  transition:opacity .2s ease;
}
.curiosity-link:hover{opacity:.7}
.curiosity-counter{
  margin-top:10px;
  font-family:var(--font-mono);font-size:10px;
  color:var(--text-muted);
  text-align:center;
}

/* ===== REVEAL ===== */
.reveal-flash{animation:flashReveal .6s ease}
@keyframes flashReveal{
  0%{opacity:0;transform:scale(1.1)}
  40%{opacity:1;transform:scale(.95)}
  100%{opacity:1;transform:scale(1)}
}

/* ===== WIN / LOSE ===== */
.meme-title{
  margin-top:10px;font-family:var(--font-mono);font-size:11px;
  color:var(--text-muted);min-height:16px;max-width:340px;
  margin-left:auto;margin-right:auto;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.source-tag{
  display:inline-block;margin-top:6px;padding:4px 10px;
  border-radius:6px;background:var(--surface-2);
  border:1px solid var(--border);font-family:var(--font-mono);
  font-size:10px;color:var(--text-muted);min-height:18px;
}

#result{
  margin-top:18px;font-family:var(--font-display);
  font-weight:600;font-size:22px;min-height:34px;
}
#result.win{color:var(--accent);animation:winBounce .8s ease}
#result.lose{color:var(--text-muted);animation:loseShake .5s ease}

@keyframes winBounce{
  0%{transform:scale(0);opacity:0}
  50%{transform:scale(1.3)}
  70%{transform:scale(.9)}
  100%{transform:scale(1);opacity:1}
}
@keyframes loseShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

.win-overlay{
  position:absolute;inset:0;
  border:3px solid var(--accent);
  border-radius:var(--radius);pointer-events:none;
  animation:glowPulse 1.5s ease infinite;
}
@keyframes glowPulse{
  0%,100%{box-shadow:inset 0 0 20px rgba(212,168,87,.1),0 0 20px rgba(212,168,87,.1)}
  50%{box-shadow:inset 0 0 40px rgba(212,168,87,.3),0 0 40px rgba(212,168,87,.3)}
}

.win-emoji{font-size:60px;animation:emojiDrop 1s ease}
@keyframes emojiDrop{
  0%{transform:translateY(-40px) scale(0);opacity:0}
  60%{transform:translateY(10px) scale(1.2);opacity:1}
  100%{transform:translateY(0) scale(1);opacity:1}
}

#score{
  margin-top:14px;font-family:var(--font-mono);
  font-size:12px;color:var(--text-muted);
}

#confettiCanvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:100;
}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<header>
  <h1>Encontre o 67</h1>
  <p>Ache a imagem com o número 67 escondida entre os memes</p>
</header>

<main>
  <div class="play-area">
    <button id="generateBtn" onclick="startCountdown()">🎲 Gerar meme aleatório</button>

    <div class="image-frame" id="imageFrame">
      <div class="placeholder">Clique no botão para sortear um meme</div>
    </div>

    <div class="meme-title" id="memeTitle"></div>
    <div class="source-tag" id="sourceTag"></div>

    <div id="result"></div>
    <div id="score">Tentativas: 0 | Vitórias: 0</div>
  </div>
</main>

<script>
// ===== IMAGENS PREMIADAS DO 67 =====
const IMAGENS_67=[
  "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTP-BVWbYIIljpEpNxPCnR9ZUG2Q71dBukW8l_srCzalMl442KI3tndcmEl&s=10",
  "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSaXlwqHkaqDVt1P4l-acWBpeQsCVx5pcmZqLwKFSNvJQ&s",
  "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStQEdvhloPVpRXwoDA5Gq875SzK4JqU0OkpPjzvIrUaIGaE_CgxOZyPn0&s=10"
];

// Chance de 25% de aparecer o 67 (aumentada por ter mais imagens)
const CHANCE_DE_67=0.25;
const COUNTDOWN_SECONDS=30;

let tentativas=0,vitorias=0,rodando=false;
let memeCache=[];

// ===== CURIOSIDADES =====
const curiosidades=[
  {texto:"O coração humano bate cerca de 100.000 vezes por dia.",link:"https://pt.wikipedia.org/wiki/Cora%C3%A7%C3%A3o"},
  {texto:"Os golfinhos dormem com um olho aberto para se proteger de predadores.",link:"https://pt.wikipedia.org/wiki/Golfinho"},
  {texto:"O mel é o único alimento que nunca estraga. Já encontraram mel comestível em tumbas egípcias.",link:"https://pt.wikipedia.org/wiki/Mel"},
  {texto:"Uma nuvem média pesa cerca de 500 toneladas.",link:"https://pt.wikipedia.org/wiki/Nuvem"},
  {texto:"O DNA humano é 60% idêntico ao de uma banana.",link:"https://pt.wikipedia.org/wiki/%C3%81cido_desoxirribonucleico"},
  {texto:"Existem mais estrelas no universo do que grãos de areia na Terra.",link:"https://pt.wikipedia.org/wiki/Estrela"},
  {texto:"Os polvos têm três corações e sangue azul.",link:"https://pt.wikipedia.org/wiki/Polvo"},
  {texto:"A Torre Eiffel pode crescer até 15cm no verão por causa da dilatação térmica.",link:"https://pt.wikipedia.org/wiki/Torre_Eiffel"},
  {texto:"Um raio é 5 vezes mais quente que a superfície do Sol.",link:"https://pt.wikipedia.org/wiki/Raio_(meteorologia)"},
  {texto:"A Lua se afasta da Terra cerca de 3,8cm por ano.",link:"https://pt.wikipedia.org/wiki/Lua"},
  {texto:"O cérebro humano usa 20% de toda a energia do corpo.",link:"https://pt.wikipedia.org/wiki/C%C3%A9rebro"},
  {texto:"Os tubarões existem há mais tempo que as árvores — cerca de 400 milhões de anos.",link:"https://pt.wikipedia.org/wiki/Tubar%C3%A3o"},
  {texto:"O som não se propaga no vácuo do espaço.",link:"https://pt.wikipedia.org/wiki/Som"},
  {texto:"Os flamingos só conseguem comer com a cabeça virada de cabeça para baixo.",link:"https://pt.wikipedia.org/wiki/Flamingo"},
  {texto:"O olho do avestruz é maior que o seu próprio cérebro.",link:"https://pt.wikipedia.org/wiki/Avestruz"},
  {texto:"Plutão não completou uma órbita ao redor do Sol desde que foi descoberto em 1930.",link:"https://pt.wikipedia.org/wiki/Plut%C3%A3o_(planeta_an%C3%A3o)"},
  {texto:"A água-viva é composta por 95% de água.",link:"https://pt.wikipedia.org/wiki/%C3%81gua-viva"},
  {texto:"Os gatos possuem mais de 20 vocalizações diferentes, incluindo o ronronar.",link:"https://pt.wikipedia.org/wiki/Gato"},
  {texto:"O Monte Everest cresce cerca de 4mm por ano devido ao movimento tectônico.",link:"https://pt.wikipedia.org/wiki/Monte_Evereste"},
  {texto:"As impressões digitais dos coalas são quase idênticas às dos humanos.",link:"https://pt.wikipedia.org/wiki/Coala"},
  {texto:"A Grande Muralha da China NÃO pode ser vista do espaço a olho nu.",link:"https://pt.wikipedia.org/wiki/Grande_Muralha_da_China"},
  {texto:"O recorde mundial de tempo sem dormir é de 11 dias (264 horas).",link:"https://pt.wikipedia.org/wiki/Priva%C3%A7%C3%A3o_de_sono"},
  {texto:"Existem mais de 7.000 línguas faladas no mundo atualmente.",link:"https://pt.wikipedia.org/wiki/L%C3%ADngua_natural"},
  {texto:"O corpo humano adulto tem 206 ossos, mas bebês nascem com cerca de 270.",link:"https://pt.wikipedia.org/wiki/Esqueleto_humano"},
  {texto:"A luz do Sol leva 8 minutos e 20 segundos para chegar à Terra.",link:"https://pt.wikipedia.org/wiki/Sol"},
  {texto:"Uma pessoa média anda o equivalente a 5 voltas ao mundo durante a vida.",link:"https://pt.wikipedia.org/wiki/Caminhada"},
  {texto:"O coração de um camarão fica localizado na sua cabeça.",link:"https://pt.wikipedia.org/wiki/Camar%C3%A3o"},
  {texto:"As bananas são levemente radioativas por conterem potássio-40.",link:"https://pt.wikipedia.org/wiki/Dose_equivalente_de_banana"},
  {texto:"O planeta Vênus gira no sentido oposto ao da maioria dos planetas do Sistema Solar.",link:"https://pt.wikipedia.org/wiki/V%C3%A9nus_(planeta)"},
  {texto:"Um fio de cabelo humano pode suportar até 100 gramas de peso.",link:"https://pt.wikipedia.org/wiki/Cabelo"},
  {texto:"Os corvos são capazes de reconhecer rostos humanos e guardar rancor.",link:"https://pt.wikipedia.org/wiki/Corvo"},
  {texto:"O estômago humano produz um novo revestimento de muco a cada 3 a 4 dias.",link:"https://pt.wikipedia.org/wiki/Est%C3%B4mago"},
  {texto:"As estrelas-do-mar não possuem cérebro.",link:"https://pt.wikipedia.org/wiki/Estrela-do-mar"},
  {texto:"O Oceano Pacífico é maior que todos os continentes juntos.",link:"https://pt.wikipedia.org/wiki/Oceano_Pac%C3%ADfico"},
  {texto:"As abelhas conseguem reconhecer e lembrar de rostos humanos.",link:"https://pt.wikipedia.org/wiki/Abelha"},
  {texto:"Os elefantes são os únicos animais que não conseguem pular.",link:"https://pt.wikipedia.org/wiki/Elefante"},
  {texto:"A pele é o maior órgão do corpo humano, pesando cerca de 4kg.",link:"https://pt.wikipedia.org/wiki/Pele"},
  {texto:"Cleópatra viveu mais perto da invenção do iPhone do que da construção das pirâmides.",link:"https://pt.wikipedia.org/wiki/Cle%C3%B3patra"},
  {texto:"O Lago Baikal na Rússia contém 20% de toda a água doce líquida do planeta.",link:"https://pt.wikipedia.org/wiki/Lago_Baikal"}
];

function getRandomCuriosidades(n){
  const shuffled=[...curiosidades].sort(()=>Math.random()-.5);
  return shuffled.slice(0,n);
}

function getImagem67(){
  return IMAGENS_67[Math.floor(Math.random()*IMAGENS_67.length)];
}

// ===== MEME CACHE =====
async function carregarMemes(){
  try{
    const res=await fetch('https://api.imgflip.com/get_memes');
    const data=await res.json();
    if(data.success&&data.data.memes.length>0){
      memeCache=data.data.memes;
    }
  }catch(e){}
}

function getMemeAleatorio(){
  if(memeCache.length>0){
    const pick=memeCache[Math.floor(Math.random()*memeCache.length)];
    return{url:pick.url,title:pick.name,source:'imgflip'};
  }
  const seed=Date.now()+Math.floor(Math.random()*100000);
  return{url:`https://picsum.photos/seed/${seed}/400/400`,title:'Imagem aleatória',source:'picsum'};
}

function preloadImage(url){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject();
    img.src=url;
  });
}

// ===== CONFETTI =====
function launchConfetti(){
  const canvas=document.getElementById('confettiCanvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  const particles=[];
  const colors=['#d4a857','#f5d78e','#fff','#ffa500','#ff6347','#7fff00','#00bfff','#ff69b4'];
  for(let i=0;i<150;i++){
    particles.push({
      x:canvas.width/2+(Math.random()-.5)*200,
      y:canvas.height/2-100,
      vx:(Math.random()-.5)*15,
      vy:Math.random()*-15-5,
      size:Math.random()*8+3,
      color:colors[Math.floor(Math.random()*colors.length)],
      rotation:Math.random()*360,
      rotSpeed:(Math.random()-.5)*10,
      gravity:.25,life:1,
      decay:Math.random()*.008+.003
    });
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    for(const p of particles){
      if(p.life<=0)continue;
      alive=true;
      p.x+=p.vx;p.vy+=p.gravity;p.y+=p.vy;
      p.rotation+=p.rotSpeed;p.life-=p.decay;
      ctx.save();ctx.translate(p.x,p.y);
      ctx.rotate(p.rotation*Math.PI/180);
      ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      ctx.restore();
    }
    if(alive)requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}

// ===== COUNTDOWN =====
async function startCountdown(){
  if(rodando)return;
  rodando=true;

  const btn=document.getElementById('generateBtn');
  const frame=document.getElementById('imageFrame');
  const resultEl=document.getElementById('result');
  const titleEl=document.getElementById('memeTitle');
  const sourceEl=document.getElementById('sourceTag');

  btn.disabled=true;
  btn.innerText='⏳ Gerando...';
  resultEl.innerText='';resultEl.className='';
  titleEl.innerText='';sourceEl.innerText='';

  const sorteou67=Math.random()<CHANCE_DE_67;
  let memeData=null;
  let imgPreloaded=null;
  let url67Escolhida=null;

  if(sorteou67){
    url67Escolhida=getImagem67();
    preloadImage(url67Escolhida).then(img=>{imgPreloaded=img}).catch(()=>{});
  }else{
    memeData=getMemeAleatorio();
    preloadImage(memeData.url).then(img=>{imgPreloaded=img}).catch(()=>{
      memeData={url:`https://picsum.photos/seed/${Date.now()}/400/400`,title:'Imagem aleatória',source:'picsum'};
      preloadImage(memeData.url).then(img2=>{imgPreloaded=img2}).catch(()=>{});
    });
  }

  const curios=getRandomCuriosidades(3);
  let curioAtual=0;

  const circumference=2*Math.PI*62;
  let secondsLeft=COUNTDOWN_SECONDS;
  const emojis=['🃏','🎴','🖼️','❓','🎰','🔮'];
  let emojiIndex=0;

  function renderCountdown(){
    const progress=((COUNTDOWN_SECONDS-secondsLeft)/COUNTDOWN_SECONDS)*circumference;
    const c=curios[curioAtual];
    const nextIn=10-((COUNTDOWN_SECONDS-secondsLeft)%10);

    frame.innerHTML=`
      <div class="countdown-container">
        <div class="timer-ring">
          <svg viewBox="0 0 140 140">
            <circle class="bg" cx="70" cy="70" r="62"/>
            <circle class="progress" cx="70" cy="70" r="62"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${circumference-progress}"/>
          </svg>
          <div class="timer-center">
            <div class="shuffle-icon">${emojis[emojiIndex]}</div>
            <div class="timer-seconds">${secondsLeft}s</div>
            <div class="timer-label">RESTANTE</div>
          </div>
        </div>
        <div class="curiosity-box">
          <div class="curiosity-label">💡 Você sabia? (${curioAtual+1}/3)</div>
          <div class="curiosity-text">${c.texto}</div>
          <a class="curiosity-link" href="${c.link}" target="_blank" rel="noopener">🔗 Saiba mais na Wikipédia →</a>
          <div class="curiosity-counter">${curioAtual<2?`Próxima curiosidade em ${nextIn}s`:''}</div>
        </div>
      </div>
    `;
  }

  renderCountdown();

  const countInterval=setInterval(()=>{
    secondsLeft--;

    if(secondsLeft%2===0){
      emojiIndex=(emojiIndex+1)%emojis.length;
    }

    const elapsed=COUNTDOWN_SECONDS-secondsLeft;
    curioAtual=Math.min(Math.floor(elapsed/10),2);

    if(secondsLeft<=0){
      clearInterval(countInterval);
      revealImage(sorteou67,memeData,imgPreloaded,url67Escolhida);
      return;
    }
    renderCountdown();
  },1000);
}

function revealImage(sorteou67,memeData,imgPreloaded,url67Escolhida){
  const frame=document.getElementById('imageFrame');
  const resultEl=document.getElementById('result');
  const titleEl=document.getElementById('memeTitle');
  const sourceEl=document.getElementById('sourceTag');
  const btn=document.getElementById('generateBtn');

  frame.innerHTML='';

  if(sorteou67){
    if(imgPreloaded){
      imgPreloaded.style.width='100%';
      imgPreloaded.style.maxHeight='380px';
      imgPreloaded.style.objectFit='contain';
      imgPreloaded.className='reveal-flash';
      frame.appendChild(imgPreloaded);
    }else{
      const img=document.createElement('img');
      img.src=url67Escolhida||IMAGENS_67[0];
      img.className='reveal-flash';
      frame.appendChild(img);
    }
    const overlay=document.createElement('div');
    overlay.className='win-overlay';
    frame.appendChild(overlay);

    titleEl.innerHTML='<span class="win-emoji">🏆</span> O MEME DO 67!';
    sourceEl.innerText='⭐ imagem premiada';

    tentativas++;vitorias++;
    resultEl.innerText='🎉 VOCÊ ACHOU O 67! PARABÉNS! 🎉';
    resultEl.className='win';

    setTimeout(()=>launchConfetti(),200);
    setTimeout(()=>launchConfetti(),800);

  }else{
    if(imgPreloaded){
      imgPreloaded.style.width='100%';
      imgPreloaded.style.maxHeight='380px';
      imgPreloaded.style.objectFit='contain';
      imgPreloaded.className='reveal-flash';
      frame.appendChild(imgPreloaded);
    }else if(memeData){
      const img=document.createElement('img');
      img.src=memeData.url;
      img.className='reveal-flash';
      frame.appendChild(img);
    }else{
      frame.innerHTML='<div class="placeholder">Erro ao carregar imagem.</div>';
    }

    titleEl.innerText=memeData?memeData.title:'';
    sourceEl.innerText=memeData?memeData.source:'';

    tentativas++;
    resultEl.innerText='❌ Não é essa... tente de novo!';
    resultEl.className='lose';
  }

  document.getElementById('score').innerText=`Tentativas: ${tentativas} | Vitórias: ${vitorias}`;
  btn.innerText='🎲 Gerar meme aleatório';
  btn.disabled=false;
  rodando=false;
}

carregarMemes();
</script>
</body>
</html>
